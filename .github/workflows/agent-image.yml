name: agent-image

# Builds the hardened Hermes image and pushes it to GHCR. The control plane
# launches a pinned tag via AGENT_IMAGE_REF (e.g. ghcr.io/<owner>/agntos-hermes:v0.1.0).

on:
  push:
    branches: [main]
    paths: ["agent-image/**", ".github/workflows/agent-image.yml"]
    tags: ["agent-v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agntos-hermes

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `agent-v0.1.0` is not valid semver, so `type=semver` skips it. Match the
          # `agent-` prefix and emit the captured `v0.1.0` as the image tag, so the
          # documented pin (…/agntos-hermes:v0.1.0) actually exists. `sha-<short>`
          # tags give immutable pins for AGENT_IMAGE_REF; no `:latest` is pushed.
          tags: |
            type=ref,event=branch
            type=match,pattern=agent-(v.*),group=1
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./agent-image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
