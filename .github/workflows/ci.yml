name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: pnpm -r typecheck
      - name: Build web
        # Build with placeholder env so Next compiles without real secrets.
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/agntos
          BETTER_AUTH_SECRET: ci-placeholder-secret
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm --filter @agntos/web build
